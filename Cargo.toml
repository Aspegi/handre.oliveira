[workspace]
resolver = "2"
members = [
    "crates/rnfc-abstractions",
    "crates/rnfc-core",
    "crates/rnfc-backend-sitl",
    "crates/rnfc-daa",
    "crates/rnfc-fdir",
    "crates/rnfc-hal",
    "crates/rnfc-lnn",
    "crates/rnfc-certis",
    "crates/rnfc-hase",
    "crates/rnfc-swarm-certis",
    "crates/rnfc-certchain",
    "crates/rnfc-magnav",
    "crates/rnfc-omni",
    "crates/rnfc-counterfactual",
    "crates/rnfc-scc",
    "crates/rnfc-decision",
    "crates/rnfc-watch",
    "crates/rnfc-mavsign",
    "crates/rnfc-anchor",
    "crates/rnfc-alert",
    "crates/rnfc-mavlink",
    "crates/rnfc-surveillance",
    "crates/rnfc-backend-isr",
]

[workspace.package]
authors = ["Andre Oliveira <handre.oliveira@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
















