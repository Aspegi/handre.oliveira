name: Kani

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  kani:
    name: Kani proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: Run Kani on rnfc-core
        run: cargo kani -p rnfc-core