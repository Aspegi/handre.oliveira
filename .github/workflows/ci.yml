name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        run: cargo test --workspace --no-fail-fast

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets 2>&1 | tee clippy.log; exit 0

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  supply-chain:
    name: Supply chain (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (RustSec advisories)
        run: cargo audit --deny warnings
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny (license + bans + sources)
        run: cargo deny check

  sbom:
    name: SBOM (CycloneDX + SPDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: psastras/sbom-rs/actions/install-cargo-sbom@cargo-sbom-latest
      - name: Generate CycloneDX SBOM
        run: cargo sbom --output-format cyclone_dx_json_1_6 > rnfc-sbom.cdx.json
      - name: Generate SPDX SBOM
        run: cargo sbom --output-format spdx_json_2_3 > rnfc-sbom.spdx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            rnfc-sbom.cdx.json
            rnfc-sbom.spdx.json

  embedded:
    name: Cortex-M4F builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Build MCU crates
        run: |
          cargo build -p rnfc-abstractions --target thumbv7em-none-eabihf --release
          cargo build -p rnfc-fdir --target thumbv7em-none-eabihf --release
          cargo build -p rnfc-lnn --target thumbv7em-none-eabihf --release
          cargo build -p rnfc-hal --target thumbv7em-none-eabihf --release
