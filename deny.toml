# cargo-deny configuration — supply chain policy for RNFC
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # Add advisory IDs here with expiration dates, e.g.:
    # "RUSTSEC-0000-0000", # expires 2026-12-31 — reason
]

[licenses]
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    # Crates we do not want in the graph:
    # { name = "openssl", reason = "use rustls instead" },
]
skip = [
    # Crates we allow to be duplicated:
    # { name = "bitflags", version = "=1.3.2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# Do not let build scripts fetch from the network
[bans.workspace-dependencies]
duplicates = "warn"
